<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/beaba.css">
    <link rel="shortcut icon" href="./assets/images/estrela.png" type="image/x-icon">
    <title>Beabadoobee</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Beabadoobee</h1>
        <a href="index.html"><img src="./assets/images/estrela.png" class="cabecalho_disco__adela" alt="Disco da cantora Adela" width="150px"></a>
    </header>
    <main class="albuns">
        <section class="albuns_botoes">
            <button class="tecla tecla_SUPERSCAR">
                <div class="albuns_span">
                    <img src="./assets/images/10.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar All I Did Was Dream Of You - Beabadoobee</span>
                </div>
            </button>
            <button class="tecla tecla_ImTheMan">
                <div class="albuns_span">
                    <img src="./assets/images/11.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar Coffee - Beabadoobee</span>
                </div>
            </button>
            <button class="tecla tecla_AintInLA">
                <div class="albuns_span">
                    <img src="./assets/images/12.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar Real Man - Beabadoobee</span>
                </div>
            </button>
            <button class="tecla tecla_KGB">
                <div class="albuns_span">
                    <img src="./assets/images/13.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar The Perfect Pair - Beabadoobee</span>
                </div>
            </button>
            <button class="tecla tecla_NicoleKidman">
                <div class="albuns_span">
                    <img src="./assets/images/15.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar Death bed - Beabadoobee</span>
                </div>
            </button>
            <button class="tecla tecla_Boys">
                <div class="albuns_span">
                    <img src="./assets/images/16.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar Tired - Beabadoobee</span>
                </div>
            </button>

            <audio src="./assets/sounds/beabadoobee - All I Did Was Dream Of You (Official Video) ft. The Marías.mp3" 
            id="tocar_tecla_SUPERSCAR"></audio>
            <audio src="./assets/sounds/Beabadoobee - Coffee.mp3" 
            id="tocar_tecla_ImTheMan"></audio>
            <audio src="./assets/sounds/beabadoobee - Real Man.mp3" 
            id="tocar_tecla_AintInLA"></audio>
            <audio src="./assets/sounds/beabadoobee - the perfect pair (Official Audio).mp3" id="tocar_tecla_KGB"></audio>
            <audio src="./assets/sounds/Powfu - death bed (coffee for your head) (Official Video) ft. beabadoobee.mp3" id="tocar_tecla_NicoleKidman"></audio>
            <audio src="./assets/sounds/Beabadoobee - Tired.mp3" 
            id="tocar_tecla_Boys"></audio>
        </section>
    </main>
    <footer class="rodape">
            <footer class="rodape">
        <h2>&copy; Todos os direitos reservados a <a href="https://github.com/isadorafarias-eng" target="_blank">Isa Weber</a></h2>
    </footer>
    <script src="./script/app2.js"></script>
</body>
</html>
