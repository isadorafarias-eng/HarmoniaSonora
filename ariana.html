<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/ariana.css">
    <link rel="shortcut icon" href="./assets/images/Globo.png" type="image/x-icon">
    <title>Ariana</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Ariana Grande</h1>
        <a href="index.html"><img src="./assets/images/Globo.png" class="cabecalho_disco__adela" alt="Disco da cantora Adela" width="150px"></a>
        
    </header>
    <main class="albuns">
        <section class="albuns_botoes">
            <button class="tecla tecla_SUPERSCAR">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana1.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Tocar Ariana Grande - 7 Rings</span>
                </div>
            </button>
            <button class="tecla tecla_ImTheMan">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana2.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Ariana Grande - hate that i made you love me</span>
                </div>
            </button>
            <button class="tecla tecla_AintInLA">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana3.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Ariana Grande - Let Me Love You</span>
                </div>
            </button>
            <button class="tecla tecla_KGB">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana4.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Ariana Grande - needy</span>
                </div>
            </button>
            <button class="tecla tecla_NicoleKidman">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana5.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Ariana Grande - pov</span>
                </div>
            </button>
            <button class="tecla tecla_Boys">
                <div class="albuns_span">
                    <img src="./assets/images/Ariana6.png" alt="Foto de Album" width="250px" class="album">
                    <span class="span_adela">Ariana Grande, Doja Cat - motive </span>
                </div>
            </button>

            <audio src="./assets/sounds/Ariana Grande - 7 rings (Official Video).mp3" 
            id="tocar_tecla_SUPERSCAR"></audio>
            <audio src="./assets/sounds/Ariana Grande - hate that i made you love me (official lyric video).mp3" 
            id="tocar_tecla_ImTheMan"></audio>
            <audio src="./assets/sounds/Ariana Grande - Let Me Love You ft. Lil Wayne.mp3" 
            id="tocar_tecla_AintInLA"></audio>
            <audio src="./assets/sounds/Ariana Grande - needy (Official Audio).mp3" id="tocar_tecla_KGB"></audio>
            <audio src="./assets/sounds/Ariana Grande - pov (official audio).mp3" id="tocar_tecla_NicoleKidman"></audio>
            <audio src="./assets/sounds/Ariana Grande, Doja Cat - motive (official audio).mp3" 
            id="tocar_tecla_Boys"></audio>
        </section>
    </main>
    <footer class="rodape">
            <footer class="rodape">
        <h2>&copy; Todos os direitos reservados a <a href="https://github.com/isadorafarias-eng" target="_blank">Isa Weber</a></h2>
    </footer>
    <script src="./script/app1.js"></script>
</body>
</html>
